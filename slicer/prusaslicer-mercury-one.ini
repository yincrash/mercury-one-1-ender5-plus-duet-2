# PrusaSlicer config bundle for the Zero G Mercury One.1 (Ender 5 Plus frame) on a Duet 2 running RepRapFirmware 3.6.
# Import with File > Import > Import Config Bundle. Contains no network or host details;
# add your Duet under Printer Settings > Physical Printer (host type Duet) after importing.
# Derived from the PrusaSlicer Voron V2 350 HF0.4 profiles, resized to this machine's config.g limits.
# Source: https://github.com/yincrash/mercury-one-1-ender5-plus-duet-2/tree/main/slicer

