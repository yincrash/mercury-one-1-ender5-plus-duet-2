filament_unloading_speed_start = 100
filament_vendor = Overture
first_layer_bed_temperature = 80
first_layer_temperature = 245
full_fan_speed_layer = 4
max_fan_speed = 50
min_fan_speed = 30
min_print_speed = 15
slowdown_below_layer_time = 15
start_filament_gcode = "; Filament-specific start gcode\nM572 D0 S0.12 ; pressure advance for Overture PETG at 245 C (two PA towers, 2026-09-10); printer end G-code resets it to 0"
temperature = 245

[printer:Mercury One.1 (Plus) - 0.4mm Nozzle (High Flow)]
autoemit_temperature_commands = 0
bed_custom_model = 
bed_custom_texture = 
bed_shape = 0x0,365x0,365x332,0x332
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;{layer_z}
between_objects_gcode = 
binary_gcode = 0
color_change_gcode = M600
cooling_tube_length = 20
cooling_tube_retraction = 45
custom_parameters_printer = 
default_filament_profile = Overture PETG @MercuryOne
default_print_profile = 0.20mm Standard @MercuryOne
deretract_speed = 35
end_gcode = ; PrusaSlicer end G-code for MercuryOne (Duet 2 Ethernet, RRF 3.6)\nM104 S0 ; hotend off\nM140 S0 ; bed off\nM83\nG1 E-3 F1800 ; retract a little to limit ooze\nM572 D0 S0 ; reset pressure advance; each filament profile sets its own in its start G-code\nG91 ; relative moves\nG1 Z10 F300 ; drop the bed 10 mm (Z max 400 in M208, verified 2026-09-11)\nG90 ; absolute moves\nG1 X5 Y325 F6000 ; park the head at the back-left, out of the way\nM106 S0 ; part fan off\nM84 ; motors off\n
extra_loading_move = -52
extruder_clearance_height = 33
extruder_clearance_radius = 75
extruder_colour = ""
extruder_offset = 0x0
gcode_flavor = reprapfirmware
high_current_on_filament_swap = 0
host_type = duet
layer_gcode = ;AFTER_LAYER_CHANGE\n;{layer_z}
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 1500,1500
machine_max_acceleration_extruding = 5000,5000
machine_max_acceleration_retracting = 1500,1500
machine_max_acceleration_travel = 5000,5000
machine_max_acceleration_x = 5000,5000
machine_max_acceleration_y = 5000,5000
machine_max_acceleration_z = 100,100
machine_max_feedrate_e = 100,100
machine_max_feedrate_x = 250,250
machine_max_feedrate_y = 250,250
machine_max_feedrate_z = 8,8
machine_max_jerk_e = 5,5
machine_max_jerk_x = 8,8
machine_max_jerk_y = 8,8
machine_max_jerk_z = 0.5,0.5
machine_max_junction_deviation = 0,0
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.3
max_print_height = 400
min_layer_height = 0.07
multimaterial_purging = 140
nozzle_diameter = 0.4
nozzle_high_flow = 1
parking_pos_retraction = 84
pause_print_gcode = PAUSE
prefer_clockwise_movements = 0
print_host = 
printer_model = 
printer_notes = Zero G Mercury One.1 CoreXY conversion of a Creality Ender 5 Plus on a Duet 2 Ethernet running RepRapFirmware 3.6. Rapido 2 hotend (0.4 high flow), Sherpa Mini extruder, BLTouch. Usable bed 365 x 332 mm, origin front-left.\nDo not remove the keywords below; the matching print and filament presets use them in their compatible-printer conditions.\nPRINTER_VENDOR_ZEROG\nPRINTER_MODEL_MERCURY_ONE
printer_settings_id = 
printer_technology = FFF
printer_variant = 
printer_vendor = 
printhost_apikey = 
printhost_cafile = 
remaining_times = 1
retract_before_travel = 2
retract_before_wipe = 80%
retract_layer_change = 0
retract_length = 0.8
retract_length_toolchange = 0
retract_lift = 0.2
retract_lift_above = 0.25
retract_lift_below = 0
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 35
silent_mode = 0
single_extruder_multi_material = 0
start_gcode = ; PrusaSlicer start G-code for MercuryOne (Duet 2 Ethernet, RRF 3.6)\n; Printer Settings > Custom G-code > Start G-code. G-code flavor: RepRapFirmware.\n; Bed shape 365 x 332, origin 0,0. Use relative E distances.\nM140 S[first_layer_bed_temperature] ; start heating the bed\nM104 S150 ; warm the hotend without oozing while we home and probe\nM190 S[first_layer_bed_temperature] ; wait for the bed BEFORE homing: Z0 must be set on a hot bed\nG28 ; home all (XY to endstops, Z with the BLTouch at the mesh centre)\nG29 S1 ; load the saved height map (heightmap.csv) and enable mesh compensation\nG1 X5 Y3 Z10 F6000 ; move to the purge line start (front-left, inside the usable area)\nM109 S[first_layer_temperature] ; wait for hotend\nM83 ; relative extrusion\nG92 E0\nG1 Z0.3 F300\nG1 X120 Y3 E12 F900 ; purge line along the front edge\nG1 X120 Y3.6 F3000 ; small sideways step to break the string\nG1 X30 Y3.6 E4 F900 ; second, thinner pass back\nG92 E0\nG1 Z2 F300 ; lift before the travel to the first object\n
template_custom_gcode = 
thumbnails = 32x32/PNG, 300x300/PNG, 400x300/PNG
thumbnails_format = PNG
toolchange_gcode = 
travel_lift_before_obstacle = 0
travel_max_lift = 1.5
travel_ramping_lift = 0
travel_slope = 1
use_firmware_retraction = 0
use_relative_e_distances = 1
use_volumetric_e = 0
variable_layer_height = 1
wipe = 0
z_offset = 0

